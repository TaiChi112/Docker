services:
  ubuntu:
    image: ubuntu:latest
    container_name: ubuntu-container
    stdin_open: true
    tty: true
    volumes:
      - ./shared:/shared
      - ubuntu_data:/data
    networks:
      - os_network
    command: /bin/bash
    restart: unless-stopped
    environment:
      - DEBIAN_FRONTEND=noninteractive
    working_dir: /shared

  alpine:
    image: alpine:latest
    container_name: alpine-container
    stdin_open: true
    tty: true
    volumes:
      - ./shared:/shared
      - alpine_data:/data
    networks:
      - os_network
    command: /bin/sh
    restart: unless-stopped
    working_dir: /shared

  ubuntu-dev:
    image: ubuntu:latest
    container_name: ubuntu-dev-container
    stdin_open: true
    tty: true
    volumes:
      - ./shared:/shared
      - ./ubuntu-dev:/workspace
      - ubuntu_dev_data:/data
    networks:
      - os_network
    command: /bin/bash
    restart: unless-stopped
    environment:
      - DEBIAN_FRONTEND=noninteractive
    working_dir: /workspace
    # Install development tools
    entrypoint: |
      bash -c "
        apt-get update && 
        apt-get install -y curl wget git vim nano build-essential python3 python3-pip nodejs npm &&
        exec /bin/bash
      "

  alpine-dev:
    image: alpine:latest
    container_name: alpine-dev-container
    stdin_open: true
    tty: true
    volumes:
      - ./shared:/shared
      - ./alpine-dev:/workspace
      - alpine_dev_data:/data
    networks:
      - os_network
    command: /bin/sh
    restart: unless-stopped
    working_dir: /workspace
    # Install development tools
    entrypoint: |
      sh -c "
        apk update && 
        apk add --no-cache curl wget git vim nano build-base python3 py3-pip nodejs npm &&
        exec /bin/sh
      "

volumes:
  ubuntu_data:
    driver: local
  alpine_data:
    driver: local
  ubuntu_dev_data:
    driver: local
  alpine_dev_data:
    driver: local

networks:
  os_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
