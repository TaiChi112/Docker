version: '3.8'

services:
  ubuntu:
    image: ubuntu:latest
    container_name: ubuntu-container
    stdin_open: true
    tty: true
    volumes:
      - ./shared:/shared
      - ubuntu_data:/data
    command: /bin/bash
    restart: unless-stopped
    environment:
      - DEBIAN_FRONTEND=noninteractive
    working_dir: /shared

  alpine:
    image: alpine:latest
    container_name: alpine-container
    stdin_open: true
    tty: true
    volumes:
      - ./shared:/shared
      - alpine_data:/data
    command: /bin/sh
    restart: unless-stopped
    working_dir: /shared

volumes:
  ubuntu_data:
    driver: local
  alpine_data:
    driver: local
