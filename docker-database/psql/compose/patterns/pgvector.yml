# pgVector Example - PostgreSQL with Vector Extensions for AI
# เหมาะสำหรับ AI/ML applications และ embeddings storage

version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    environment:
      POSTGRES_PASSWORD: vectorpass
      POSTGRES_DB: vectordb
      POSTGRES_USER: vectoruser
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      # Init script เพื่อ enable vector extension
      - ./vector-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectoruser -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Example AI application service
  ai-app:
    image: python:3.11-slim
    container_name: ai-vector-app
    environment:
      DATABASE_URL: postgresql://vectoruser:vectorpass@pgvector:5432/vectordb
    volumes:
      - ./ai-app:/app
    working_dir: /app
    command: ["python", "-c", "print('AI app ready to connect to pgvector')"]
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - default

volumes:
  pgvector_data:
    driver: local