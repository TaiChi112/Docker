# High Availability PostgreSQL Cluster
# 1 Primary + 2 Replicas พร้อม HAProxy และ PgBouncer

version: '3.8'

services:
  # Primary PostgreSQL Node
  pg-0:
    image: bitnami/postgresql-repmgr:16
    container_name: pg-primary
    environment:
      REPMGR_PARTNER_NODES: pg-0,pg-1,pg-2
      REPMGR_NODE_NAME: pg-0
      REPMGR_NODE_NETWORK_NAME: pg-0
      REPMGR_PRIMARY_HOST: pg-0
      REPMGR_PASSWORD: repmgrpass
      POSTGRESQL_POSTGRES_PASSWORD: postgrespass
      POSTGRESQL_USERNAME: pguser
      POSTGRESQL_PASSWORD: pgpass
      POSTGRESQL_DATABASE: pgdb
    volumes:
      - pg_0_data:/bitnami/postgresql
    networks:
      - db-network
    restart: unless-stopped

  # Replica 1
  pg-1:
    image: bitnami/postgresql-repmgr:16
    container_name: pg-replica-1
    environment:
      REPMGR_PARTNER_NODES: pg-0,pg-1,pg-2
      REPMGR_NODE_NAME: pg-1
      REPMGR_NODE_NETWORK_NAME: pg-1
      REPMGR_PRIMARY_HOST: pg-0
      REPMGR_PASSWORD: repmgrpass
      POSTGRESQL_POSTGRES_PASSWORD: postgrespass
      POSTGRESQL_USERNAME: pguser
      POSTGRESQL_PASSWORD: pgpass
      POSTGRESQL_DATABASE: pgdb
    volumes:
      - pg_1_data:/bitnami/postgresql
    networks:
      - db-network
    depends_on:
      - pg-0
    restart: unless-stopped

  # Replica 2
  pg-2:
    image: bitnami/postgresql-repmgr:16
    container_name: pg-replica-2
    environment:
      REPMGR_PARTNER_NODES: pg-0,pg-1,pg-2
      REPMGR_NODE_NAME: pg-2
      REPMGR_NODE_NETWORK_NAME: pg-2
      REPMGR_PRIMARY_HOST: pg-0
      REPMGR_PASSWORD: repmgrpass
      POSTGRESQL_POSTGRES_PASSWORD: postgrespass
      POSTGRESQL_USERNAME: pguser
      POSTGRESQL_PASSWORD: pgpass
      POSTGRESQL_DATABASE: pgdb
    volumes:
      - pg_2_data:/bitnami/postgresql
    networks:
      - db-network
    depends_on:
      - pg-0
    restart: unless-stopped

  # HAProxy Load Balancer
  haproxy:
    image: haproxy:2.8
    container_name: postgres-haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"  # Write operations (primary)
      - "5433:5433"  # Read operations (replicas)
      - "8404:8404"  # HAProxy stats
    networks:
      - db-network
    depends_on:
      - pg-0
      - pg-1
      - pg-2
    restart: unless-stopped

  # PgBouncer Connection Pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: postgres-pgbouncer
    environment:
      DATABASES_HOST: haproxy
      DATABASES_PORT: 5432
      DATABASES_USER: pguser
      DATABASES_PASSWORD: pgpass
      DATABASES_DBNAME: pgdb
      POOL_MODE: transaction
      SERVER_RESET_QUERY: DISCARD ALL
      MAX_CLIENT_CONN: 25
      DEFAULT_POOL_SIZE: 5
    ports:
      - "6432:5432"  # PgBouncer port
    networks:
      - db-network
    depends_on:
      - haproxy
    restart: unless-stopped

networks:
  db-network:
    driver: bridge

volumes:
  pg_0_data:
    driver: local
  pg_1_data:
    driver: local
  pg_2_data:
    driver: local