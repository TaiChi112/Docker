# HAProxy Configuration สำหรับ PostgreSQL HA Cluster
# Primary node สำหรับ write operations
# Replica nodes สำหรับ read operations

global
    daemon
    log stdout local0 info

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log global

# Frontend สำหรับ write operations (primary only)
frontend postgres_primary
    bind *:5432
    default_backend postgres_primary_backend

# Frontend สำหรับ read operations (replicas)
frontend postgres_read
    bind *:5433
    default_backend postgres_read_backend

# Backend สำหรับ primary node (write)
backend postgres_primary_backend
    option pgsql-check user haproxy
    server pg-0 pg-0:5432 check port 5432

# Backend สำหรับ read replicas
backend postgres_read_backend
    balance roundrobin
    option pgsql-check user haproxy
    server pg-1 pg-1:5432 check port 5432
    server pg-2 pg-2:5432 check port 5432

# Statistics page
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE