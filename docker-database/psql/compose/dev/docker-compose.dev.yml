# Development PostgreSQL Setup with pgAdmin
# พร้อม pgAdmin UI และ init scripts สำหรับการพัฒนา

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-dev
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Mount init scripts - จะรันทุกไฟล์ .sql และ .sh ใน initdb/
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-dev
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - postgres-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  pgadmin_data:
    driver: local